# Mahad monorepo CI — mobile (Flutter), backend (NestJS), web (React/Vite), Docker images.
# Blocking checks: analyze/tests/builds. Backend & web ESLint run as a report only for now:
# the existing code had lint debt before the UI redesign (cleanup is a separate task).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      # The NDK download on hosted runners is occasionally corrupt; install it up front with retries.
      - name: Install Android NDK (retry)
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null && exit 0
            echo "NDK install attempt $i failed, retrying..."; sleep 15
          done
          exit 1
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mahad-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (prisma generate)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Tests
        run: npx jest --passWithNoTests
      - name: Lint (report only)
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  web:
    name: Web (React/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint (report only)
        continue-on-error: true
        run: npx eslint .

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t mahad-backend:ci ./backend
      - name: Build nginx (web) image
        run: docker build -t mahad-nginx:ci -f deploy/nginx/Dockerfile .
