user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  2048;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;
  client_max_body_size 25m;

  # ---------- gzip ----------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/x-javascript
    application/xml application/xml+rss application/rss+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype
    image/svg+xml image/x-icon;
  # Build paytida oldindan siqilgan .gz fayllar (CPU tejaydi).
  gzip_static on;

  # ---------- rate limit ----------
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
  limit_req_status 429;

  upstream backend {
    server backend:3333;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # Umumiy proxy sozlamalari
  proxy_http_version 1.1;
  proxy_set_header Connection        "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # =====================================================================
  # Asosiy: web panel + /api + /static  (80 — yangi; 2222 — eski web manzili)
  # =====================================================================
  server {
    listen 80 default_server;
    listen 2222;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://backend;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
    }

    # Yuklangan rasmlar — to'g'ridan-to'g'ri volume'dan (backendga yuk tushmaydi)
    location /static/ {
      alias /srv/static/;
      access_log off;
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Vite build fayllari (nomida hash bor) — uzoq kesh
    location /assets/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }

  # =====================================================================
  # Eski mobil ilovalar (1.3.x) uchun: http://<ip>:3333/api/v1 ishlashda davom etadi
  # =====================================================================
  server {
    listen 3333;
    server_name _;

    location = /api/v1/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://backend;
    }

    location /static/ {
      alias /srv/static/;
      access_log off;
      expires 7d;
      try_files $uri =404;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
    }
  }
}
