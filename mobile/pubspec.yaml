name: test_app
description: "Mahad test platformasi — o'quvchilar uchun mobil ilova."

publish_to: 'none'

# 1.3.8 — telefonlardagi oxirgi eski versiya. Yangi ilova undan yuqori bo'lishi shart.
version: 1.4.0+140

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.8.0+1
  get_storage: ^2.1.1
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0
  android_id: ^0.4.0
  mask_text_input_formatter: ^2.9.0
  cupertino_icons: ^1.0.8
  iconsax_flutter: ^1.0.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/patterns/
    - assets/google_fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/splash_logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
