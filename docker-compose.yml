name: mahad

# Ishga tushirish:  cp .env.example .env  (parollarni o'zgartiring)  &&  docker compose up -d --build
# Holat:            docker compose ps     |   Loglar: docker compose logs -f backend

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD kerak}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahad_test_db}
      MYSQL_USER: ${MYSQL_USER:-mahad}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD kerak}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      # Birinchi ishga tushishda (bo'sh volume) shu papkadagi *.sql / *.sql.gz avtomatik yuklanadi.
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
    image: mahad-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-mahad}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-mahad_test_db}
      REDIS_URL: redis://redis:6379
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET kerak}
      JWT_EXPIRES: ${JWT_EXPIRES:-30d}
      APP_VERSION: ${APP_VERSION:-1.3.6}
      DB_SYNC: ${DB_SYNC:-true}
      TZ: UTC
    volumes:
      - uploads:/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: mahad-nginx:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${LEGACY_WEB_PORT:-2222}:2222"   # eski web manzili
      - "${LEGACY_API_PORT:-3333}:3333"   # eski mobil ilovalar (1.3.x) uchun
    volumes:
      - uploads:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

volumes:
  mysql_data:
  uploads:

networks:
  internal:
